<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pool Caustics</title>
  <style>
    html, body, #root { margin: 0; height: 100%; background: #372f2d; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // No build step: fetch the .jsx, compile it in the browser, import it.
    const src = await (await fetch("./PoolCaustics.jsx")).text();
    const { code } = Babel.transform(src, {
      presets: [["react", { runtime: "automatic" }]],
      filename: "PoolCaustics.jsx",
    });
    const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    const { default: PoolCaustics } = await import(url);

    const { createElement: h } = await import("react");
    const { createRoot } = await import("react-dom/client");

    createRoot(document.getElementById("root")).render(
      h(PoolCaustics, { style: { height: "100vh" } })
    );
  </script>
</body>
</html>
