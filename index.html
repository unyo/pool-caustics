<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#008DB9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pool" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <title>Pool Caustics</title>
  <style>
    html, body, #root { margin: 0; height: 100%; background: var(--bg, #008DB9); }
    html, body { overflow: hidden; overscroll-behavior: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Colors from the URL, e.g. ?bg=008DB9&fg=00BBFF&quality=high (hex, "#" optional).
    // bg is the pool floor, fg the caustic light. Anything else is ignored.
    const params = new URLSearchParams(location.search);
    const hex = (k) => {
      const v = (params.get(k) || "").trim().replace(/^#/, "");
      return /^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v) ? "#" + v : undefined;
    };
    const floorColor = hex("bg") || "#008DB9";
    const lightColor = hex("fg") || "#00BBFF";
    // ?quality=high|medium|low ("med" works too); defaults to medium.
    const q = (params.get("quality") || "").toLowerCase();
    const quality = { high: "high", medium: "medium", med: "medium", low: "low" }[q] || "medium";
    // ?angle=30: light angle in degrees from straight down (any number).
    const angle = parseFloat(params.get("angle"));
    const lightAngle = Number.isFinite(angle) ? angle : 21.7;
    document.documentElement.style.setProperty("--bg", floorColor);
    document.querySelector('meta[name="theme-color"]').content = floorColor;

    // No build step: fetch the .jsx, compile it in the browser, import it.
    const src = await (await fetch("./PoolCaustics.jsx")).text();
    const { code } = Babel.transform(src, {
      presets: [["react", { runtime: "automatic" }]],
      filename: "PoolCaustics.jsx",
    });
    const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    const { default: PoolCaustics } = await import(url);

    const { createElement: h } = await import("react");
    const { createRoot } = await import("react-dom/client");

    createRoot(document.getElementById("root")).render(
      // Pinned to the screen and sized to the largest viewport so it runs edge to
      // edge, under the notch/Dynamic Island and home indicator (viewport-fit=cover).
      h(PoolCaustics, { floorColor, lightColor, quality, lightAngle, style: { position: "fixed", top: 0, left: 0, right: 0, height: "100lvh" } })
    );
  </script>
</body>
</html>
