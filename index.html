<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pool Caustics</title>
  <style>
    html, body, #root { margin: 0; height: 100%; background: #372f2d; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    // Surface load failures on the page (there's no console on a phone).
    function showError(msg) {
      if (window.__started) return; // only startup failures; the app reports its own
      document.getElementById("root").innerHTML =
        '<p style="color:#fff;font:14px/1.4 system-ui,sans-serif;padding:16px;margin:0"></p>';
      document.querySelector("#root p").textContent = "Couldn't start: " + msg;
    }
    window.addEventListener("error", (e) => showError(e.message));
    window.addEventListener("unhandledrejection", (e) => showError(String(e.reason && e.reason.message || e.reason)));
    if (!(HTMLScriptElement.supports && HTMLScriptElement.supports("importmap")))
      showError("this browser doesn't support import maps (iOS 16.4+ / Safari 16.4+ needed)");
  </script>
  <script type="module">
    // No build step: fetch the .jsx, compile it in the browser, import it.
    const src = await (await fetch("./PoolCaustics.jsx")).text();
    const { code } = Babel.transform(src, {
      presets: [["react", { runtime: "automatic" }]],
      filename: "PoolCaustics.jsx",
    });
    const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    const { default: PoolCaustics } = await import(url);

    const { createElement: h } = await import("react");
    const { createRoot } = await import("react-dom/client");

    createRoot(document.getElementById("root")).render(
      h(PoolCaustics, { style: { height: "100vh" } })
    );
    window.__started = true;
  </script>
</body>
</html>
